<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multimedia Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Multimedia Page</h1>

    <hr>

    <section>
        <div class="box">
            <h2>Favorite Photos</h2>

            <img src="photo1.jpg" alt="Favorite Photo 1">
            <img src="photo2.jpeg" alt="Favorite Photo 2">
            <img src="photo3.jpg" alt="Favorite Photo 3">
            <img src="photo4.jpg" alt="Favorite Photo 4">
            <img src="photo5.jpg" alt="Favorite Photo 5">
        </div>
    </section>

    <hr>

    <section>
        <div class="box music">
            <h2>Most Played Music</h2>

            <h3>Black</h3>
            <p>Pearl Jam</p>
            <audio controls><source src="audio1.mp3" type="audio/mpeg"></audio>

            <h3>Stop Crying Your Heart Out</h3>
            <p>Oasis</p>
            <audio controls><source src="audio2.mp3" type="audio/mpeg"></audio>

            <h3>Wake Up</h3>
            <p>Coheed and Cambria</p>
            <audio controls><source src="audio3.mp3" type="audio/mpeg"></audio>

            <h3>Last Night On Earth</h3>
            <p>Green Day</p>
            <audio controls><source src="audio4.mp3" type="audio/mpeg"></audio>

            <h3>Neutron Star Collision</h3>
            <p>Muse</p>
            <audio controls><source src="audio5.mp3" type="audio/mpeg"></audio>
        </div>
    </section>

    <hr>

    <section>
        <div class="box video-box">
            <h2>Videos</h2>

            <h3>Love, Philippines Clip</h3>
            <video controls><source src="video1.mp4" type="video/mp4"></video>

            <h3>Panama Clip</h3>
            <video controls><source src="video2.mp4" type="video/mp4"></video>

            <h3>Ireland Clip</h3>
            <video controls><source src="video3.mp4" type="video/mp4"></video>

            <h3>Vigan Clip</h3>
            <video controls><source src="video4.mp4" type="video/mp4"></video>

            <h3>Baguio Clip</h3>
            <video controls><source src="video5.mp4" type="video/mp4"></video>
        </div>
    </section>

</body>
</html>
